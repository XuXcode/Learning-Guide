name: docs build

on:
  workflow_dispatch:
  push:
    branches:
      # 确保这是你正在使用的分支名称
      - main

permissions:
  contents: write

concurrency:
  group: learning-guide-pages
  cancel-in-progress: false

jobs:
  LearnData-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          # 获取所有标记和分支的所有历史记录（updatetime 必须，否则每次都会变化）
          fetch-depth: 0
          # 如果文档包含 Git 子模块，请取消注释下一行
          # submodules: true

      # pnpm/setup 同时装 pnpm 和 Node，并自动执行 pnpm install
      - name: Install pnpm & Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      # 构建培养方案知识库
      - name: Build Docs
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: |-
          pnpm run docs:build
          > src/.vuepress/dist/.nojekyll

      - name: Deploy GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # 指定静态文件部署到的分支
          branch: gh-pages
          folder: src/.vuepress/dist
          force: false
